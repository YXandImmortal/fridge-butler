spring:
  application:
    name: fridge-butler-backend
  profiles:
    active: dev

server:
  port: 8081
  servlet:
    context-path: /api

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}
  remember-me-expiration: ${JWT_REMEMBER_ME_EXPIRATION}

system:
  name: 智鲜·引擎
  version: release 0.3.1
  slogan: 智能管理您的冰箱，让食材更新鲜
  build-time: 20260605-02
  # 管理员账号自动初始化配置
  # 生产环境建议通过环境变量 ADMIN_AUTO_INIT_ENABLED 控制，首次部署时开启，完成后关闭
  admin:
    auto-init:
      enabled: false
      accounts:
        - username: ${ADMIN_USERNAME:admin}
          role-code: SUPER_ADMIN
      output-dir: ${ADMIN_CREDENTIALS_DIR:}
      file-name: admin-credentials.txt
  # 业务系统默认数据自动初始化配置
  data:
    init:
      enabled: false
  # 系统角色自动初始化配置
  # 首次部署时建议开启，确保 sys_role 表中有预设角色数据
  role:
    init:
      enabled: false

ai:
  history:
    retention-days: 7
    purge-days: 30
  chat:
    max-history-rounds: 10

deepseek:
  api-key: ${DEEPSEEK_API_KEY}
  base-url: https://api.deepseek.com
  model: deepseek-v4-pro
  temperature: 0.7
  max-tokens: 4096

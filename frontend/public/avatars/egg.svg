<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
    <defs>
        <linearGradient id="bg-egg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#CE93D8"/>
            <stop offset="100%" stop-color="#AB47BC"/>
        </linearGradient>
    </defs>
    <!-- 圆形背景 -->
    <circle cx="50" cy="50" r="50" fill="url(#bg-egg)"/>
    <!-- 蛋托底座 -->
    <g fill="#ffffff" opacity="0.35">
        <rect x="26" y="74" width="48" height="6" rx="3"/>
        <rect x="30" y="78" width="40" height="4" rx="2"/>
    </g>
    <!-- 鸡蛋主体 -->
    <g fill="#ffffff" opacity="0.95">
        <ellipse cx="42" cy="52" rx="14" ry="18" transform="rotate(-12 42 52)"/>
        <circle cx="44" cy="55" r="7" fill="#FFDE33"/>
        <ellipse cx="58" cy="52" rx="14" ry="18" transform="rotate(12 58 52)"/>
    </g>


    <!-- 鸡蛋高光 -->
    <ellipse cx="38" cy="44" rx="4" ry="7" transform="rotate(-20 38 44)" fill="#ffffff" opacity="0.6"/>
    <ellipse cx="54" cy="44" rx="4" ry="7" transform="rotate(-8 54 44)" fill="#ffffff" opacity="0.5"/>
    <!-- 鸡蛋斑点装饰 -->
    <circle cx="46" cy="60" r="1.5" fill="#AB47BC" opacity="0.2"/>
    <circle cx="60" cy="56" r="1.2" fill="#AB47BC" opacity="0.18"/>
    <circle cx="38" cy="54" r="1" fill="#AB47BC" opacity="0.15"/>
</svg>
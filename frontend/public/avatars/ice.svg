<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
    <defs>
        <linearGradient id="bg-ice" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#80DEEA"/>
            <stop offset="100%" stop-color="#4DD0E1"/>
        </linearGradient>
    </defs>
    <!-- 圆形背景 -->
    <circle cx="50" cy="50" r="50" fill="url(#bg-ice)"/>
    <!-- 冰块主体 -->
    <g opacity="0.95">
        <!-- 冰块正面 -->
        <rect x="30" y="32" width="40" height="40" rx="10" fill="#ffffff" opacity="0.9"/>
        <!-- 冰块高光面 -->
        <rect x="30" y="32" width="22" height="40" rx="10" fill="#ffffff" opacity="0.45"/>
        <!-- 顶部反光 -->
        <path d="M38 36 L50 36 Q54 36 54 40 L54 44 Q54 48 50 48 L38 48 Q34 48 34 44 L34 40 Q34 36 38 36Z" fill="#ffffff"
              opacity="0.5"/>
    </g>
    <!-- 冰块内部气泡 -->
    <circle cx="42" cy="55" r="3" fill="#4DD0E1" opacity="0.35"/>
    <circle cx="55" cy="62" r="2" fill="#4DD0E1" opacity="0.25"/>
    <!-- 底部阴影反光 -->

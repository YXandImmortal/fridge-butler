        <rect x="44" y="30" width="12" height="10" rx="2"/>
        <!-- 瓶身 -->
        <path d="M34 40 L66 40 Q68 40 68 42 L68 76 Q68 82 62 82 L38 82 Q32 82 32 76 L32 42 Q32 40 34 40Z"/>
    </g>
    <!-- 瓶身装饰线条 -->
    <line x1="36" y1="50" x2="64" y2="50" stroke="#64B5F6" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
    <!-- 牛奶标签小点缀 -->
    <circle cx="50" cy="62" r="7" fill="#64B5F6" opacity="0.25"/>
    <circle cx="50" cy="62" r="3.5" fill="#64B5F6" opacity="0.4"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
    <defs>
        <linearGradient id="bg-orange" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFB74D"/>
            <stop offset="100%" stop-color="#FFA726"/>
        </linearGradient>
    </defs>
    <!-- 圆形背景 -->
    <circle cx="50" cy="50" r="50" fill="url(#bg-orange)"/>
    <!-- 橙子主体 -->
    <g>
        <circle cx="50" cy="54" r="24" fill="#ffffff" opacity="0.95"/>
        <!-- 橙子顶部高光 -->
        <path d="M35 42 Q40 32 50 32 Q60 32 65 42 Q58 38 50 38 Q42 38 35 42Z" fill="#ffffff" opacity="0.5"/>
    </g>
    <!-- 橙子纹理 -->
    <g stroke="#FFA726" stroke-width="1" opacity="0.25" fill="none">
        <line x1="50" y1="30" x2="50" y2="78"/>
        <line x1="26" y1="54" x2="74" y2="54"/>
        <line x1="33" y1="37" x2="67" y2="71"/>
        <line x1="67" y1="37" x2="33" y2="71"/>
    </g>
    <!-- 橙子蒂 -->
    <g fill="#ffffff" opacity="0.85">
        <ellipse cx="50" cy="28" rx="4" ry="6"/>
        <!-- 小叶子 -->
        <ellipse cx="58" cy="26" rx="7" ry="4" transform="rotate(30 58 26)"/>
    </g>
    <!-- 底部小阴影 -->
    <ellipse cx="50" cy="80" rx="14" ry="2.5" fill="#FFA726" opacity="0.2"/>
</svg>
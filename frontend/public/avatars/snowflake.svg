<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
    <defs>
        <linearGradient id="bg-snow" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#90CAF9"/>
            <stop offset="100%" stop-color="#42A5F5"/>
        </linearGradient>
    </defs>
    <!-- 圆形背景 -->
    <circle cx="50" cy="50" r="50" fill="url(#bg-snow)"/>
    <!-- 雪花 -->
    <g stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" opacity="0.95">
        <!-- 主轴6条 -->
        <line x1="50" y1="20" x2="50" y2="80"/>
        <line x1="24" y1="35" x2="76" y2="65"/>
        <line x1="24" y1="65" x2="76" y2="35"/>
    </g>
    <!-- 雪花分支 -->
    <g stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.85">
        <!-- 上分支 -->
        <line x1="50" y1="28" x2="42" y2="36"/>
        <line x1="50" y1="28" x2="58" y2="36"/>
        <!-- 下分支 -->
        <line x1="50" y1="72" x2="42" y2="64"/>
        <line x1="50" y1="72" x2="58" y2="64"/>
        <!-- 左分支 -->
        <line x1="30" y1="41" x2="38" y2="45"/>
        <line x1="30" y1="41" x2="34" y2="50"/>
        <!-- 右分支 -->
        <line x1="70" y1="59" x2="62" y2="55"/>
        <line x1="70" y1="59" x2="66" y2="50"/>
        <!-- 左下分支 -->
        <line x1="30" y1="59" x2="38" y2="55"/>
        <line x1="30" y1="59" x2="34" y2="50"/>
        <!-- 右上分支 -->
        <line x1="70" y1="41" x2="62" y2="45"/>
        <line x1="70" y1="41" x2="66" y2="50"/>
    </g>
    <!-- 中心装饰 -->
    <circle cx="50" cy="50" r="5.5" fill="#ffffff" opacity="0.9"/>
    <circle cx="50" cy="50" r="3" fill="url(#bg-snow)" opacity="0.6"/>
</svg>
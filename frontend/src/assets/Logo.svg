<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="智能冰箱管理系统 Logo">
    <defs>
        <!-- 六边形背景渐变（深色科技风格） -->
        <linearGradient id="hexGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1E293B" />
            <stop offset="100%" stop-color="#0F172A" />
        </linearGradient>

        <!-- 背景投影阴影 -->
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
        </filter>

        <!-- 六边形裁剪路径（用于实现冰箱的“切入”效果） -->
        <clipPath id="hexClip">
            <polygon points="256,56 429,156 429,356 256,456 83,356 83,156" />
        </clipPath>
    </defs>

    <!-- 1. 正六边形背景 -->
    <polygon
            points="256,56 429,156 429,356 256,456 83,356 83,156"
            fill="url(#hexGradient)"
            stroke="#38BDF8"
            stroke-width="6"
            filter="url(#shadow)"
    />

    <!-- 2. 左半边：放大的智能冰箱图案（通过裁剪路径实现切入六边形边的效果） -->
    <g id="fridge" clip-path="url(#hexClip)">
        <!-- 冰箱主体 -->
        <rect x="60" y="130" width="190" height="250" rx="15" fill="#F8FAFC" />

        <!-- 左门（冷冻室） -->
        <rect x="65" y="140" width="85" height="230" rx="8" fill="#CBD5E1" />

        <!-- 左门把手 -->
        <line x1="130" y1="170" x2="130" y2="270" stroke="#475569" stroke-width="8" stroke-linecap="round" />
        <line x1="130" y1="310" x2="130" y2="350" stroke="#475569" stroke-width="8" stroke-linecap="round" />

        <!-- 右门（冷藏室） -->
        <rect x="155" y="140" width="85" height="230" rx="8" fill="#CBD5E1" />

        <!-- 右门把手 -->
        <line x1="175" y1="170" x2="175" y2="270" stroke="#475569" stroke-width="8" stroke-linecap="round" />
        <line x1="175" y1="310" x2="175" y2="350" stroke="#475569" stroke-width="8" stroke-linecap="round" />
        <!-- 门中缝分隔线 -->
        <line x1="153" y1="145" x2="153" y2="365" stroke="#94A3B8" stroke-width="10" stroke-linecap="round"/>
        <line x1="60" y1="290" x2="235" y2="290" stroke="#94A3B8" stroke-width="10" stroke-linecap="round"/>
    </g>

    <!-- 3. 中间物联网系统连接线（代表软硬件互联） -->


    <!-- 4. 右半边：代表代码元素的 </>（尺寸缩小并加入科技节点） -->
    <g id="code" >
        <!-- 代码符号路径 -->
        <!-- < -->
        <path d="M 310,230 L 270,260 L 310,290" fill="none" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
        <!-- / -->
        <path d="M 350,230 L 330,290" fill="none" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" />
        <!-- > -->
        <path d="M 370,230 L 410,260 L 370,290" fill="none" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

    </g>
</svg>
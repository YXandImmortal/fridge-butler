<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
    <defs>
        <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#64B5F6;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#42A5F5;stop-opacity:1" />
        </linearGradient>
    </defs>
    <circle cx="50" cy="50" r="45" fill="url(#grad1)" />

    <!-- 天线 -->
    <line x1="50" y1="30" x2="50" y2="18" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <circle cx="50" cy="15" r="5" fill="#FFB74D" /> <!-- 警示色点缀 -->

    <!-- 耳朵（侧边接收器） -->
    <rect x="15" y="40" width="8" height="20" rx="4" fill="#E3F2FD" />
    <rect x="77" y="40" width="8" height="20" rx="4" fill="#E3F2FD" />

    <!-- 面部玻璃罩 -->
    <rect x="28" y="32" width="44" height="36" rx="10" fill="#ffffff" />

    <!-- 眼睛（LED显示） -->
    <circle cx="38" cy="48" r="5" fill="#2d3748" />
    <circle cx="62" cy="48" r="5" fill="#2d3748" />

    <!-- 嘴巴（微笑呼吸灯） -->
    <rect x="40" y="58" width="20" height="4" rx="2" fill="#2d3748" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
    <defs>
        <style>
            /* 智能冰箱管理系统主题色变量映射 */
            .bg-circle { fill: #E3F2FD; }      /* --primary-light */
            .panda-white { fill: #ffffff; }    /* --card-bg */
            .panda-black { fill: #2d3748; }    /* --text-primary */
            .tech-accent { fill: #64B5F6; }    /* --primary-color */
            .tech-accent-dark { fill: #42A5F5; } /* --primary-dark */
            .blush-color { fill: #FFB74D; opacity: 0.6; } /* --warn-color */
            .smile-line { stroke: #2d3748; stroke-width: 2; fill: none; stroke-linecap: round; }
        </style>
    </defs>

    <!-- 底部背景光圈（契合管理系统UI风格） -->
    <circle cx="50" cy="50" r="48" class="bg-circle" />

    <!-- 熊猫耳朵 -->
    <circle cx="25" cy="30" r="16" class="panda-black" />
    <circle cx="75" cy="30" r="16" class="panda-black" />

    <!-- 内耳科技蓝点缀 -->
    <circle cx="25" cy="30" r="8" class="tech-accent" />
    <circle cx="75" cy="30" r="8" class="tech-accent" />

    <!-- 熊猫脸部 -->
    <circle cx="50" cy="55" r="35" class="panda-white" />

    <!-- 熊猫黑眼圈（眼睛） -->
    <ellipse cx="35" cy="55" rx="10" ry="12" class="panda-black" />
    <ellipse cx="65" cy="55" rx="10" ry="12" class="panda-black" />

    <!-- 眼部高光 -->
    <circle cx="32" cy="52" r="3" class="panda-white" />
    <circle cx="62" cy="52" r="3" class="panda-white" />

    <!-- 腮红 -->
    <circle cx="23" cy="70" r="5" class="blush-color" />
    <circle cx="77" cy="70" r="5" class="blush-color" />

    <!-- 熊猫鼻子 -->
    <circle cx="50" cy="68" r="4" class="panda-black" />
    <!-- 鼻子高光 -->
    <circle cx="48" cy="66" r="1.5" class="panda-white" />

    <!-- 微笑嘴巴 -->
    <path d="M 44 72 Q 50 78 56 72" class="smile-line" />

    <!-- 智能领结（体现智能冰箱的连接与管理属性） -->
    <path d="M 43 86 L 57 86 L 50 94 Z" class="tech-accent" />
    <circle cx="50" cy="86" r="4" class="tech-accent-dark" />

    <!-- 领结科技感高光点 -->
    <circle cx="47" cy="88" r="1.5" class="panda-white" opacity="0.5" />
    <circle cx="53" cy="88" r="1.5" class="panda-white" opacity="0.5" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
    <!-- 背景（深蓝色科技感） -->
    <circle cx="50" cy="50" r="45" fill="#42A5F5" />

    <!-- 数据网络轨道 -->
    <circle cx="50" cy="50" r="35" fill="none" stroke="#E3F2FD" stroke-width="2" stroke-dasharray="6 4" />

    <!-- 数据链路 -->
    <line x1="25" y1="30" x2="50" y2="50" stroke="#ffffff" stroke-width="2" opacity="0.8" />
    <line x1="75" y1="30" x2="50" y2="50" stroke="#ffffff" stroke-width="2" opacity="0.8" />
    <line x1="25" y1="70" x2="50" y2="50" stroke="#ffffff" stroke-width="2" opacity="0.8" />
    <line x1="75" y1="70" x2="50" y2="50" stroke="#ffffff" stroke-width="2" opacity="0.8" />

    <!-- 外围节点 -->
    <circle cx="25" cy="30" r="7" fill="#ffffff" />
    <circle cx="75" cy="30" r="7" fill="#ffffff" />
    <circle cx="25" cy="70" r="7" fill="#ffffff" />
    <circle cx="75" cy="70" r="7" fill="#ffffff" />

    <!-- 核心中枢（警示色高亮） -->
    <circle cx="50" cy="50" r="16" fill="#FFB74D" />

    <!-- 中枢内部：微型冰箱图标 -->
    <rect x="43" y="44" width="14" height="12" rx="2" fill="#ffffff" />
    <line x1="50" y1="44" x2="50" y2="56" stroke="#42A5F5" stroke-width="2" />
    <rect x="46" y="47" width="2" height="2" rx="0.5" fill="#42A5F5" />
    <rect x="52" y="47" width="2" height="2" rx="0.5" fill="#42A5F5" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
    <!-- 背景（极浅底色+边框） -->
    <circle cx="50" cy="50" r="45" fill="#fafafa" stroke="#E3F2FD" stroke-width="2" />

    <!-- 叶子 -->
    <path d="M50 30 Q60 15 75 25" stroke="#81D4FA" stroke-width="6" fill="none" stroke-linecap="round" />
    <path d="M50 30 Q40 15 25 25" stroke="#81D4FA" stroke-width="6" fill="none" stroke-linecap="round" />

    <!-- 果柄 -->
    <path d="M50 30 L50 25" stroke="#606266" stroke-width="4" stroke-linecap="round" />

    <!-- 苹果身体（使用危险色） -->
    <path d="M50 30 C30 30 25 60 40 75 C45 80 55 80 60 75 C75 60 70 30 50 30 Z" fill="#F87171" />

    <!-- 高光 -->
    <path d="M40 45 Q35 55 40 65" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6" />

    <!-- 苹果籽 -->
    <circle cx="45" cy="68" r="2" fill="#2d3748" />
    <circle cx="55" cy="68" r="2" fill="#2d3748" />
</svg>
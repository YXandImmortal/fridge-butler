<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
    <!-- 冰箱主体 -->
    <rect x="50" y="20" width="200" height="260" rx="15" fill="#F8FAFC" />

    <!-- 左门（冷冻室） -->
    <rect x="65" y="35" width="85" height="230" rx="8" fill="#CBD5E1" />

    <!-- 左门把手 -->
    <line x1="125" y1="65" x2="125" y2="165" stroke="#475569" stroke-width="8" stroke-linecap="round" />
    <line x1="125" y1="205" x2="125" y2="245" stroke="#475569" stroke-width="8" stroke-linecap="round" />

    <!-- 右门（冷藏室） -->
    <rect x="150" y="35" width="85" height="230" rx="8" fill="#CBD5E1" />

    <!-- 右门把手 -->
    <line x1="170" y1="65" x2="170" y2="165" stroke="#475569" stroke-width="8" stroke-linecap="round" />
    <line x1="170" y1="205" x2="170" y2="245" stroke="#475569" stroke-width="8" stroke-linecap="round" />

    <!-- 门中缝分隔线 -->
    <line x1="150" y1="40" x2="150" y2="260" stroke="#94A3B8" stroke-width="10" stroke-linecap="round"/>

    <!-- 横线分隔（已修复为贯穿主体） -->
    <line x1="55" y1="185" x2="245" y2="185" stroke="#94A3B8" stroke-width="10" stroke-linecap="round"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
    <!-- 双门冰箱（上下两门） -->
    <rect x="28" y="12" width="44" height="76" rx="3" ry="3" fill="none" stroke="#333" stroke-width="2"/>
    <!-- 上门冷藏室 -->
    <rect x="28" y="12" width="44" height="45" rx="3" ry="3" fill="none" stroke="#333" stroke-width="1.5"/>
    <!-- 下门冷冻室 -->
    <rect x="28" y="57" width="44" height="31" rx="3" ry="3" fill="none" stroke="#333" stroke-width="1.5"/>
    <!-- 上门把手 -->
    <line x1="62" y1="28" x2="62" y2="38" stroke="#333" stroke-width="2" stroke-linecap="round"/>
    <!-- 下门把手 -->
    <line x1="62" y1="65" x2="62" y2="72" stroke="#333" stroke-width="2" stroke-linecap="round"/>
    <line x1="32" y1="85" x2="68" y2="85" stroke="#666" stroke-width="1"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- 法式多门冰箱 -->
  <rect x="15" y="10" width="70" height="80" rx="3" ry="3" fill="none" stroke="#333" stroke-width="2"/>
  
  <!-- 上面对开门冷藏室 -->
  <line x1="50" y1="10" x2="50" y2="48" stroke="#333" stroke-width="1.5"/>
  <line x1="15" y1="48" x2="85" y2="48" stroke="#333" stroke-width="1.5"/>
  
  <!-- 下面大抽屉冷冻室（两层） -->
  <line x1="15" y1="69" x2="85" y2="69" stroke="#333" stroke-width="1.5"/>
  
  <!-- 上门把手 -->
  <line x1="44" y1="22" x2="44" y2="35" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <line x1="56" y1="22" x2="56" y2="35" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  
  <!-- 抽屉把手 -->
  <line x1="42" y1="56" x2="58" y2="56" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <line x1="42" y1="77" x2="58" y2="77" stroke="#333" stroke-width="2" stroke-linecap="round"/>
</svg>
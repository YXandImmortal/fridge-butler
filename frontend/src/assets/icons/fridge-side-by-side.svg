<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- 对开门冰箱 -->
  <rect x="15" y="12" width="70" height="76" rx="3" ry="3" fill="none" stroke="#333" stroke-width="2"/>
  <!-- 中间分隔线 -->
  <line x1="50" y1="12" x2="50" y2="88" stroke="#333" stroke-width="1.5"/>
  <!-- 左侧门把手 -->
  <line x1="44" y1="25" x2="44" y2="38" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <!-- 右侧门把手 -->
  <line x1="56" y1="25" x2="56" y2="38" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <!-- 内部搁板示意 -->

  <line x1="20" y1="85" x2="46" y2="85" stroke="#999" stroke-width="1"/>

  <line x1="54" y1="85" x2="80" y2="85" stroke="#999" stroke-width="1"/>
</svg>
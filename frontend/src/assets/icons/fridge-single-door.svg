<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- 单门冰箱 -->
  <rect x="28" y="15" width="44" height="70" rx="3" ry="3" fill="none" stroke="#333" stroke-width="2"/>
  <!-- 门缝 -->
  <line x1="28" y1="35" x2="72" y2="35" stroke="#333" stroke-width="1.5"/>
  <!-- 小冷冻室标识 -->
  <rect x="35" y="22" width="18" height="8" rx="1" fill="none" stroke="#666" stroke-width="1"/>
  <!-- 门把手 -->
  <line x1="62" y1="42" x2="62" y2="52" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <!-- 底部散热/底座 -->
  <line x1="32" y1="82" x2="68" y2="82" stroke="#666" stroke-width="1"/>
</svg>
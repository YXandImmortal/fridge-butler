<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
    <!-- T型三门冰箱 -->
    <rect x="15" y="10" width="70" height="80" rx="3" ry="3" fill="none" stroke="#333" stroke-width="2"/>

    <!-- T型分隔线 -->
    <line x1="50" y1="10" x2="50" y2="55" stroke="#333" stroke-width="1.5"/>
    <line x1="15" y1="55" x2="85" y2="55" stroke="#333" stroke-width="1.5"/>

    <!-- 左门把手 -->
    <line x1="44" y1="25" x2="44" y2="35" stroke="#333" stroke-width="2" stroke-linecap="round"/>

    <!-- 右侧上门把手 -->
    <line x1="56" y1="25" x2="56" y2="35" stroke="#333" stroke-width="2" stroke-linecap="round"/>

    <line x1="40" y1="65" x2="60" y2="65" stroke="#333" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="87" x2="80" y2="87" stroke="#999" stroke-width="1"/>
</svg>
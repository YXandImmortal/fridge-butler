<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
    <!-- 三门冰箱 -->
    <rect x="28" y="10" width="44" height="80" rx="3" ry="3" fill="none" stroke="#333" stroke-width="2"/>
    <!-- 上门冷藏室 -->
    <rect x="28" y="10" width="44" height="36" rx="3" ry="3" fill="none" stroke="#333" stroke-width="1.5"/>
    <!-- 中门变温室 -->
    <rect x="28" y="46" width="44" height="18" rx="2" ry="2" fill="none" stroke="#333" stroke-width="1.5"/>
    <!-- 下门冷冻室 -->
    <rect x="28" y="64" width="44" height="26" rx="3" ry="3" fill="none" stroke="#333" stroke-width="1.5"/>
    <!-- 上门把手 -->
    <line x1="62" y1="22" x2="62" y2="36" stroke="#333" stroke-width="2" stroke-linecap="round"/>
    <!-- 中门把手 -->
    <line x1="62" y1="52" x2="62" y2="58" stroke="#333" stroke-width="2" stroke-linecap="round"/>
    <!-- 下门把手 -->
    <line x1="62" y1="72" x2="62" y2="82" stroke="#333" stroke-width="2" stroke-linecap="round"/>
</svg>